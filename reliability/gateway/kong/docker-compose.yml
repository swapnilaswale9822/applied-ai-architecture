# Minimal DB-less Kong, runnable on its own.
#
#   docker compose up -d
#   curl -i http://localhost:8000/api/agent/health                      # 401, no key
#   curl -i http://localhost:8000/api/agent/health -H 'x-api-key: demo-key-acme'
#
# The second call carries an x-correlation-id in the response — that id is what joins a
# gateway access log to an OTel trace.
services:
  kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"   # proxy
      - "8001:8001"   # admin API
    depends_on: [redis]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
